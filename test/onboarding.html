<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="app.css?v=24"><title>Welcome</title></head><body><main class="shell"><header><div class="eyebrow">BODYBUILDING COACH</div><h1>Build your programme</h1><p class="muted">Tell the coach where you are, what you want to achieve and how much time you can train. The coach selects the training structure.</p></header><section class="card" id="auth"><h2>Your account</h2><input id="email" type="email" placeholder="Email"><button id="signin">Send secure sign-in link</button><p id="authmsg" class="smallnote"></p></section><section class="card"><h2>About you</h2><div class="formgrid"><input id="display_name" placeholder="Full name"><input id="date_of_birth" type="date"><input id="height_cm" type="number" placeholder="Height cm"><select id="sex"><option value="">Sex</option><option>Male</option><option>Female</option><option>Other</option></select><select id="experience_level"><option value="">Training experience</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div></section><section class="card"><h2>Your goal</h2><div class="formgrid"><select id="primary_goal"><option value="">Primary goal</option><option>Build muscle / hypertrophy</option><option>Men's Physique</option><option>Women's Physique</option><option>Bikini</option><option>Body recomposition</option><option>Contest preparation</option></select><input id="priority_muscles" placeholder="Areas you most want to improve (optional)"><input id="target_event" placeholder="Competition / target event (optional)"><input id="target_event_date" type="date"></div></section><section class="card"><h2>Training availability</h2><div class="formgrid"><select id="training_days_per_week"><option value="">Weight-training days per week</option><option value="2">2 days</option><option value="3">3 days</option><option value="4">4 days</option><option value="5">5 days</option><option value="6">6 days</option></select><select id="session_minutes"><option value="">Typical session length</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="75">75 minutes</option><option value="90">90 minutes</option></select><textarea id="equipment_access" placeholder="Where do you train / what equipment is available? e.g. full commercial gym"></textarea><textarea id="occupation_activity" placeholder="Daily activity / physical job (optional)"></textarea><textarea id="injuries_limitations" placeholder="Current injuries, pain or movements you cannot perform"></textarea><textarea id="exercise_preferences" placeholder="Exercises you strongly prefer or need to avoid (optional)"></textarea><textarea id="notes" placeholder="Anything else relevant (optional)"></textarea></div><button id="generate" class="primary">Create My Programme</button><p id="savemsg" class="smallnote"></p></section><section class="card hidden" id="result"><div class="eyebrow">YOUR FIRST BLOCK</div><h2 id="blockName"></h2><p class="muted" id="rationale"></p><div id="sessions"></div><a class="primary biglink" href="index.html">Go to dashboard →</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="db.js?v=24"></script><script src="onboarding.js?v=24"></script></body></html>
