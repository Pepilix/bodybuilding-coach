<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b0d10'><link rel='stylesheet' href='app.css?v=193'><title>Sign in · Bodybuilding Coach</title></head><body><main class='shell authShell'><header><div class='eyebrow'>BODYBUILDING COACH</div><h1>Sign in</h1><p class='muted'>Your session stays on this device until you sign out.</p></header><section class='card'><div class='formgrid'><label class='fieldlabel'>EMAIL<input id='email' type='email' autocomplete='email' inputmode='email'></label><label class='fieldlabel'>PASSWORD<input id='password' type='password' autocomplete='current-password'></label><button id='loginBtn' class='primary'>Sign in</button><p id='msg' class='smallnote'></p></div></section><p class='smallnote'>First time using password sign-in? Open Setup in the Safari session where you are already signed in and choose Set password once.</p></main><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='db.js?v=193'></script><script>(async()=>{const u=await BBDB.user();if(u){location.replace('index.html?v=193');return}loginBtn.onclick=async()=>{msg.textContent='Signing in…';const {error}=await BBDB.signInWithPassword(email.value.trim(),password.value);if(error){msg.textContent=error.message;return}location.replace('index.html?v=193')};password.addEventListener('keydown',e=>{if(e.key==='Enter')loginBtn.click()})})();</script></body></html>
