<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b0d10'><link rel='stylesheet' href='app.css?v=194'><title>Reset password</title></head><body><main class='shell authShell'><header><div class='eyebrow'>BODYBUILDING COACH</div><h1>New password</h1><p class='muted'>Choose a new password for your coaching account.</p></header><section class='card'><div class='formgrid'><label class='fieldlabel'>NEW PASSWORD<input id='password' type='password' autocomplete='new-password' minlength='8'></label><label class='fieldlabel'>CONFIRM PASSWORD<input id='confirmPassword' type='password' autocomplete='new-password' minlength='8'></label><button id='saveBtn' class='primary'>Save password</button><p id='msg' class='smallnote'>Checking recovery link…</p></div></section></main><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='db.js?v=194'></script><script>(async()=>{await new Promise(r=>setTimeout(r,500));const {data:{session}}=await bbSupabase.auth.getSession();msg.textContent=session?'Recovery link verified. Enter your new password.':'Recovery session not found. Open this page from the reset email link.';saveBtn.onclick=async()=>{if(password.value.length<8){msg.textContent='Use at least 8 characters.';return}if(password.value!==confirmPassword.value){msg.textContent='Passwords do not match.';return}msg.textContent='Saving…';const {error}=await bbSupabase.auth.updateUser({password:password.value});if(error){msg.textContent=error.message;return}msg.textContent='Password saved. Opening your app…';setTimeout(()=>location.replace('index.html?v=194'),700)}})();</script></body></html>
