<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="app.css"><title>Setup</title></head><body><main class="shell"><header><div class="eyebrow">WELCOME</div><h1>Set up your coaching</h1><p class="muted">Join your coach with an access code, then complete your starting profile.</p></header><section class="card" id="auth"><h2>1. Your account</h2><input id="email" type="email" placeholder="Email"><button id="signin">Send secure sign-in link</button><p id="authmsg" class="smallnote"></p></section><section class="card"><h2>2. Coach access code</h2><input id="code" maxlength="12" placeholder="e.g. A1B2C3D4"><button id="claim">Use code</button><p id="codemsg" class="smallnote">Already linked? You can leave this blank.</p></section><section class="card"><h2>3. Initial details</h2><div class="formgrid"><input id="display_name" placeholder="Full name"><input id="date_of_birth" type="date"><input id="height_cm" type="number" placeholder="Height cm"><select id="sex"><option value="">Sex</option><option>Male</option><option>Female</option><option>Other</option></select><select id="experience_level"><option value="">Training experience</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><input id="primary_goal" placeholder="Primary goal"><input id="target_event" placeholder="Target event / competition"><input id="target_event_date" type="date"><input id="training_days_per_week" type="number" min="1" max="7" placeholder="Training days / week"><input id="session_minutes" type="number" placeholder="Session minutes"><textarea id="equipment_access" placeholder="Gym / equipment access"></textarea><textarea id="occupation_activity" placeholder="Work and daily activity"></textarea><textarea id="injuries_limitations" placeholder="Injuries or limitations"></textarea><textarea id="exercise_preferences" placeholder="Exercise preferences / movements to avoid"></textarea><textarea id="notes" placeholder="Anything else your coach should know"></textarea></div><button id="save" class="primary">Complete setup</button><p id="savemsg" class="smallnote"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="db.js"></script><script src="onboarding.js"></script></body></html>
